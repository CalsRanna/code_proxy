name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先建空 Release，各平台 job 并行 upload asset（已存在则跳过，保证重跑幂等）
      # --draft=false 显式发布，避免 gh release create 留下草稿
      - run: gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁定版本：代码使用 onReorderItem（3.44.0 引入），
          # 需与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          APP_BUNDLE="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "No .app bundle found in $(pwd)"
            ls -la
            exit 1
          fi
          zip -r -y CodeProxy-macOS.zip "$APP_BUNDLE"

      # 直传 Release（create-release 已预建，--clobber 容忍重跑）
      - name: Upload asset
        working-directory: build/macos/Build/Products/Release
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "CodeProxy-macOS.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁定版本：代码使用 onReorderItem（3.44.0 引入），
          # 需与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows

      - name: Package Windows app
        run: |
          # zip 内 exe 名必须与 asset 名匹配（scoop manifest 按 asset 名解析 bin 字段）
          Rename-Item build/windows/x64/runner/Release/code_proxy.exe CodeProxy-Windows.exe
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CodeProxy-Windows.zip
        shell: pwsh

      # 直传 Release（create-release 已预建，--clobber 容忍重跑）
      - name: Upload asset
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "CodeProxy-Windows.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libsqlite3-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            ninja-build \
            pkg-config \
            cmake

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁定版本：代码使用 onReorderItem（3.44.0 引入），
          # 需与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux

      - name: Package Linux app
        run: tar -czf CodeProxy-Linux.tar.gz -C build/linux/x64/release/bundle .

      # 直传 Release（create-release 已预建，--clobber 容忍重跑）
      - name: Upload asset
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "CodeProxy-Linux.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
