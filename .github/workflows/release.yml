name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁定版本：代码使用 onReorderItem（3.44.0 引入），
          # 需与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          APP_BUNDLE="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "No .app bundle found in $(pwd)"
            ls -la
            exit 1
          fi
          zip -r -y CodeProxy-macOS.zip "$APP_BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: CodeProxy-macOS
          path: build/macos/Build/Products/Release/CodeProxy-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁定版本：代码使用 onReorderItem（3.44.0 引入），
          # 需与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows

      - name: Package Windows app
        run: |
          # zip 内 exe 名必须与 asset 名匹配（scoop manifest 按 asset 名解析 bin 字段）
          Rename-Item build/windows/x64/runner/Release/code_proxy.exe CodeProxy-Windows.exe
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CodeProxy-Windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: CodeProxy-Windows
          path: CodeProxy-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libsqlite3-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            ninja-build \
            pkg-config \
            cmake

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁定版本：代码使用 onReorderItem（3.44.0 引入），
          # 需与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux

      - name: Package Linux app
        run: tar -czf CodeProxy-Linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: CodeProxy-Linux
          path: CodeProxy-Linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CodeProxy-macOS.zip
            CodeProxy-Windows.zip
            CodeProxy-Linux.tar.gz
          generate_release_notes: true
